[package]
name = "flash"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Flash game clipper: Rust + Tauri build"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde_json = "1"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts", "file_chooser"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros"] }

[features]
# Serve the built UI from the binary. `tauri dev` turns this off to use the dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
